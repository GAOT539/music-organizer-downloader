services:
  music-organizer-downloader:
    build: .
    container_name: music_organizer_downloader_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      # Descargas: HOST_MUSIC_DIR apunta a la carpeta Música del host.
      # Si no se define, Docker usa ~/Music por defecto.
      - ${HOST_MUSIC_DIR:-~/Music}:/app/output
      - ./app.py:/app/app.py
      - ./logo.png:/app/logo.png
    restart: unless-stopped
    env_file:
      - .env