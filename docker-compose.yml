services:
  music-organizer-downloader:
    build: .
    container_name: music_organizer_downloader_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      # Las descargas van a HOST_DOWNLOAD_DIR (del .env). Si Docker no tiene
      # permiso a esa ruta, cambia HOST_DOWNLOAD_DIR=./music_export en el .env.
      - ${HOST_DOWNLOAD_DIR:-./music_export}:/app/music_export
      - ./app.py:/app/app.py
      - ./logo.png:/app/logo.png
    restart: unless-stopped
    env_file:
      - .env